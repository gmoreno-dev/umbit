name: release

on:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: bibliotecas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_name }}
          releaseName: "umbit ${{ github.ref_name }}"
          releaseBody: "Linux (.deb, tarball, AppImage) e Windows 10/11 (instalador). Precisa de Spotify Premium."
          releaseDraft: false
          prerelease: false
      - name: tarball do binário (qualquer distro)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          d="umbit-$v-linux-x86_64"
          mkdir -p "$d"
          cp src-tauri/target/release/umbit "$d/umbit"
          cp packaging/umbit.desktop "$d/umbit.desktop"
          cp src-tauri/icons/128x128.png "$d/umbit.png"
          cp LICENSE README.md "$d/"
          tar czf "$d.tar.gz" "$d"
          gh release upload "$GITHUB_REF_NAME" "$d.tar.gz" --clobber

  windows:
    runs-on: windows-latest
    needs: linux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_name }}
          releaseName: "umbit ${{ github.ref_name }}"
          releaseBody: "Linux (.deb, tarball, AppImage) e Windows 10/11 (instalador). Precisa de Spotify Premium."
          releaseDraft: false
          prerelease: false
