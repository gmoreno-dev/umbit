[package]
name = "umbit"
version = "0.1.10"
description = "Cliente Spotify leve, não oficial, em 1 bit."
authors = ["gmoreno-dev"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "umbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Ligada pela CLI do Tauri em builds de produção: embute a interface em vez de
# apontar para o servidor de desenvolvimento.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
librespot = { version = "0.8", default-features = false, features = ["native-tls", "rodio-backend"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
dirs = "7"
toml = "1"
futures = "0.3"
lru = "0.18"
chrono = "0.4"
unicode-normalization = "0.1"
sha2 = "0.10"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10", features = ["tokio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
